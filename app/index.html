<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12100e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Himalayan" />
  <title>Himalayan Fortress</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="arte/icono.svg" />
  <link rel="apple-touch-icon" href="arte/icono-180.png" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="fondo" aria-hidden="true"></div>

  <header id="barra" class="barra" hidden>
    <span id="ciclo" class="barra-ciclo" hidden></span>
    <span class="marca">Himalayan Fortress</span>
    <div class="barra-der">
      <span id="recursos" class="barra-recursos" hidden></span>
      <button id="ajustes" class="icono-boton" type="button" aria-label="Ajustes" title="Ajustes">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.1" />
          <path d="M12 2.6v2.2M12 19.2v2.2M4.4 6.9l1.6 1.6M18 15.5l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 17.1l1.6-1.6M18 8.5l1.6-1.6" />
        </svg>
        <span id="red" class="red" title="Conexión"></span>
      </button>
    </div>
  </header>

  <main id="pantalla" class="pantalla"></main>

  <div id="avisos" class="avisos" aria-live="polite"></div>
  <div id="capa" class="capa" hidden></div>

  <!-- El cliente de la mesa lo sirve el propio servidor: mismo origen, misma versión. -->
  <script src="/socket.io/socket.io.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
