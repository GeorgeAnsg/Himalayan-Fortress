<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12100e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Himalayan" />
  <title>Himalayan Fortress</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="arte/icono.svg" />
  <link rel="apple-touch-icon" href="arte/icono-180.png" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <div class="fondo" aria-hidden="true"></div>

  <header id="barra" class="barra" hidden>
    <span class="marca">Himalayan Fortress</span>
    <div class="barra-der">
      <span id="red" class="red" title="Conexión"></span>
      <button id="campana" class="icono-boton" type="button" aria-label="Avisos">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 6-3 7-3 7h18s-3-1-3-7" />
          <path d="M13.7 19a2 2 0 0 1-3.4 0" />
        </svg>
      </button>
      <button id="cuenta" class="yo" type="button" aria-label="Tu cuenta"></button>
    </div>
  </header>

  <main id="pantalla" class="pantalla"></main>

  <div id="avisos" class="avisos" aria-live="polite"></div>
  <div id="capa" class="capa" hidden></div>

  <!-- El cliente de la mesa lo sirve el propio servidor: mismo origen, misma versión. -->
  <script src="/socket.io/socket.io.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
